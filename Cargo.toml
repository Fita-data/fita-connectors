[workspace]
resolver = "2"
members = ["crates/airbyte-protocol", "connectors/source-excel-multisheet"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
airbyte-protocol = { path = "crates/airbyte-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
